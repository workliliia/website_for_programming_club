<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programming Club Society</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="my_site.css">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <img class="logo" src="images/logo.svg" alt="Programming Club Logo">
  <nav>
    <ul class="nav__links">
      <li class="bar-container"><a href="index.html#home">Home</a></li>
      <li class="bar-container"><a href="president.html#committee">Committee</a></li>
    </ul>
  </nav>
  <a class="cta" href="contact.html#contact"><button>Contact</button></a>
</header>
<div class="contact-background">
  <div class="container">
    <h1>Contact Us</h1>
    <p>If you have any questions or need further information, feel free to get in touch!</p>

    <form action="mailto:programmingclub@uwsunion.org.uk" method="POST" enctype="text/plain" class="contact-form">
      <div class="form-group">
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="firstname" placeholder="Your name.." required>
      </div>

      <div class="form-group">
        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lastname" placeholder="Your last name.." required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email.." required>
      </div>

      <div class="form-group full-width">
        <label for="subject">Subject</label>
        <textarea id="subject" name="subject" placeholder="Write something.." required></textarea>
      </div>

      <input type="submit" value="Submit" class="submit-btn">
    </form>
  </div>
</div>

<footer>
  <div class="footerContainer">
    <div class="socialIcons">
      <a href="https://www.instagram.com/uws_programming"><i class="fab fa-instagram"></i></a>
      <a href="https://chat.whatsapp.com/J9o3J14t5lk6GcZCcLdBGC"><i class="fab fa-whatsapp"></i></a>
    </div>
    <div class="footerNav">
      <ul>
        <li><a href="terms.html">Terms & Conditions</a></li>
      </ul>
    </div>
    <div class="footer-copyrights">
      <p>&copy; 2024 Programming Club Society: Design by <span class="designer">Liliia Rudenko</span></p>
    </div>
  </div>
</footer>
</body>
</html>
